workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^prod-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$/'
    - when: never

stages:
  - validate
  - release_guard
  - registry
  - promote

variables:
  RELEASE_BRANCH: main
  OPS_REPOSITORY: homelab/homelab-ops
  OPS_MANIFEST: environments/prod/my-family-tree.yaml
  OPS_CATALOG: automation/stacks/catalog.yml

validate_tree_scope:
  stage: validate
  image:
    name: oven/bun:1.3.5
    pull_policy: always
  tags: [ci-build]
  services:
    - name: postgres:16-alpine
      alias: db
    - name: chrislusf/seaweedfs:3.97
      alias: media
      command: ["server", "-s3", "-dir=/data", "-ip=localhost", "-ip.bind=0.0.0.0","-master.volumeSizeLimitMB=16","-volume.max=16","-volume.minFreeSpacePercent=0"]
  variables:
    POSTGRES_HOST_AUTH_METHOD: trust
    AWS_ACCESS_KEY_ID: fixture-access
    AWS_SECRET_ACCESS_KEY: fixture-secret
    S3_ACCESS_KEY_ID: fixture-access
    S3_SECRET_ACCESS_KEY: fixture-secret
    S3_BUCKET: family-tree-test
    S3_ENDPOINT: http://media:8333
    FAMILY_TREE_TEST_LIVE_S3: "1"
    POSTGRES_DB: family_tree_test
    FAMILY_TREE_TEST_DATABASE_URL: postgresql://postgres@db:5432/family_tree_test
    DATABASE_URL: postgresql://postgres@db:5432/family_tree_test
  script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - bun install --frozen-lockfile
    - ./scripts/migrate-release.mjs
    - bun test tests/release-tree-scope.test.ts tests/public-login.test.tsx tests/account-administration.test.ts tests/account-form.test.tsx
    - bun scripts/test-account-routes.mjs --gate

release_branch_guard:
  stage: release_guard
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
    pull_policy: always
  tags: [ci-build]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^prod-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$/'
    - when: never
  script:
    - test "$CI_DEFAULT_BRANCH" = "$RELEASE_BRANCH"
    - git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
    - test "$CI_COMMIT_SHA" = "$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH")"

build_image:
  stage: registry
  image:
    name: docker:27.5.1-cli
    pull_policy: always
  services:
    - name: docker:27.5.1-dind-rootless
      alias: docker
      pull_policy: always
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  tags: [ci-build]
  needs:
    - job: release_branch_guard
    - job: validate_tree_scope
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^prod-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$/'
    - when: never
  script: |
    set -eu
    : "${LAB_REGISTRY_HOST:?LAB_REGISTRY_HOST is required}"
    : "${LAB_REGISTRY_PUSH_USER:?LAB_REGISTRY_PUSH_USER is required}"
    : "${LAB_REGISTRY_PUSH_PASSWORD:?LAB_REGISTRY_PUSH_PASSWORD is required}"
    repository="$LAB_REGISTRY_HOST/$CI_PROJECT_PATH"
    image="$repository:$CI_COMMIT_TAG"
    docker info
    docker build --platform linux/amd64 --tag "$image" .
    sh scripts/smoke-image.sh "$image"
    printf '%s' "$LAB_REGISTRY_PUSH_PASSWORD" | docker login "$LAB_REGISTRY_HOST" --username "$LAB_REGISTRY_PUSH_USER" --password-stdin
    docker push "$image"
    digest_ref=$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' |
      awk -v repo="$repository" 'index($0, repo "@sha256:") == 1 { print; exit }')
    printf '%s\n' "${digest_ref#*@}" | grep -Eq '^sha256:[0-9a-f]{64}$'
    printf 'IMAGE_DIGEST=%s\n' "$digest_ref" > release.env
  artifacts:
    reports:
      dotenv: release.env
    expire_in: 30 days
  after_script:
    - if [ -n "${LAB_REGISTRY_HOST:-}" ]; then docker logout "$LAB_REGISTRY_HOST" >/dev/null 2>&1 || true; fi

promote_ops:
  stage: promote
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
    pull_policy: always
  tags: [ci-build]
  needs:
    - job: build_image
      artifacts: true
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^prod-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$/'
    - when: never
  script: |
    set -eu
    : "${HOMELAB_OPS_PUSH_USER:?HOMELAB_OPS_PUSH_USER is required}"
    : "${HOMELAB_OPS_PUSH_TOKEN:?HOMELAB_OPS_PUSH_TOKEN is required}"
    case "$CI_SERVER_URL" in
      https://*) ;;
      *) exit 1 ;;
    esac
    export GIT_TERMINAL_PROMPT=0
    export GIT_CONFIG_COUNT=2
    export GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=
    export GIT_CONFIG_KEY_1=credential.helper
    export GIT_CONFIG_VALUE_1='!f() { if [ "$1" = get ]; then printf "username=%s\npassword=%s\n" "$HOMELAB_OPS_PUSH_USER" "$HOMELAB_OPS_PUSH_TOKEN"; fi; }; f'
    git clone --no-tags --depth 1 --branch main "${CI_SERVER_URL%/}/${OPS_REPOSITORY}.git" ops
    apk add --no-cache python3
    ops_tag="my-family-tree-${CI_COMMIT_TAG}"
    receipt_ref="refs/tags/$ops_tag"
    python3 scripts/promote-family-tree-ops.py --ops-root ops --source-tag "$CI_COMMIT_TAG" --source-commit "$CI_COMMIT_SHA" --promotion-tag "$ops_tag" --image "$IMAGE_DIGEST"
    git -C ops config user.name "family-tree release bot"
    git -C ops config user.email "family-tree-release-bot@dungxbuif.com"
    existing=$(git -C ops ls-remote --tags --refs origin "$receipt_ref")
    if [ -n "$existing" ]; then
      git -C ops fetch --no-tags --depth 1 origin "$receipt_ref:$receipt_ref"
      git -C ops diff --quiet "$receipt_ref" -- "$OPS_MANIFEST"
      exit 0
    fi
    git -C ops add "$OPS_MANIFEST" "$OPS_CATALOG"
    if ! git -C ops diff --cached --quiet; then
      git -C ops commit -m "chore(release): promote family-tree ${CI_COMMIT_TAG#prod-}"
    fi
    git -C ops tag -a "$ops_tag" -m "family-tree ${CI_COMMIT_TAG} promotion receipt"
    git -C ops push --atomic origin HEAD:refs/heads/main "$receipt_ref:$receipt_ref"
