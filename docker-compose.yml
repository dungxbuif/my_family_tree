services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-tree-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/family_tree
      - SITE_NAME=My Family Tree
      - UPLOAD_DIR=/app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:16-alpine
    container_name: family-tree-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_tree
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d family_tree"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
