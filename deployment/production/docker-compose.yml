name: family-tree

services:
  app:
    image: ${FAMILY_TREE_IMAGE:-homelab/family-tree:local}
    container_name: family-tree-app
    restart: unless-stopped
    ports:
      - "${FAMILY_TREE_PORT:-18085}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SITE_NAME: ${SITE_NAME:-My Family Tree}
      UPLOAD_DIR: /app/uploads
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-family-tree}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      NODE_ENV: production
    volumes:
      - ${UPLOAD_DIR:-/Users/dungxbuif/production/family-tree/uploads}:/app/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e "fetch('http://127.0.0.1:3000/login').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
