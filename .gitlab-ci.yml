workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^prod-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - when: never

stages:
  - validate
  - release_guard
  - registry
  - promote

variables:
  RELEASE_BRANCH: main
  OPS_REPOSITORY: homelab/homelab-ops
  OPS_MANIFEST: environments/prod/family-tree.json
  OPS_CATALOG: automation/stacks/catalog.yml

validate:
  stage: validate
  image:
    name: oven/bun:1.3.5
    pull_policy: if-not-present
  tags: [ci-build]
  script:
    - bun install --frozen-lockfile
    - bun test utils/storage/s3.test.ts
    - bun run lint
    - bun run build

release_branch_guard:
  stage: release_guard
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
  tags: [ci-build]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^prod-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$/'
    - when: never
  script:
    - test "$CI_DEFAULT_BRANCH" = "$RELEASE_BRANCH"
    - git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" "refs/remotes/origin/$RELEASE_BRANCH"

build_image:
  stage: registry
  image:
    name: docker:27.5.1-cli
    pull_policy: if-not-present
  services:
    - name: docker:27.5.1-dind-rootless
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  tags: [ci-build]
  needs:
    - job: validate
    - job: release_branch_guard
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^prod-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$/'
    - when: never
  script:
    - docker info
    - export IMAGE="$LAB_REGISTRY_HOST/$CI_PROJECT_PATH:$CI_COMMIT_TAG"
    - test -n "$LAB_REGISTRY_HOST"
    - test -n "$LAB_REGISTRY_PUSH_USER"
    - test -n "$LAB_REGISTRY_PUSH_PASSWORD"
    - printf '%s' "$LAB_REGISTRY_PUSH_PASSWORD" | docker login "$LAB_REGISTRY_HOST" --username "$LAB_REGISTRY_PUSH_USER" --password-stdin
    - docker build --platform linux/amd64 -t "$IMAGE" .
    - docker push "$IMAGE"
    - export IMAGE_DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
    - test "$IMAGE_DIGEST" = "$LAB_REGISTRY_HOST/$CI_PROJECT_PATH@${IMAGE_DIGEST##*@}"
    - printf '%s\n' "${IMAGE_DIGEST##*@}" | grep -Eq '^sha256:[0-9a-f]{64}
    - printf 'IMAGE_DIGEST=%s\n' "$IMAGE_DIGEST" > release.env
  artifacts:
    reports:
      dotenv: release.env
    expire_in: 30 days
  after_script:
    - docker logout "$LAB_REGISTRY_HOST" >/dev/null 2>&1 || true

promote_ops:
  stage: promote
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
  tags: [ci-build]
  needs:
    - job: build_image
      artifacts: true
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^prod-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$/'
    - when: never
  script: |
    set -eu
    : "${HOMELAB_OPS_PUSH_TOKEN:?HOMELAB_OPS_PUSH_TOKEN is required}"
    case "$CI_SERVER_URL" in
      https://*) ;;
      *) exit 1 ;;
    esac
    export GIT_TERMINAL_PROMPT=0
    export GIT_CONFIG_COUNT=2
    export GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=
    export GIT_CONFIG_KEY_1=credential.helper
    export GIT_CONFIG_VALUE_1='!f() { if [ "$1" = get ]; then printf "username=oauth2\npassword=%s\n" "$HOMELAB_OPS_PUSH_TOKEN"; fi; }; f'
    git clone --no-tags --depth 1 --branch main "${CI_SERVER_URL%/}/${OPS_REPOSITORY}.git" ops
    apk add --no-cache python3
    ops_tag="family-tree-${CI_COMMIT_TAG}"
    receipt_ref="refs/tags/$ops_tag"
    python3 scripts/promote-family-tree-ops.py --ops-root ops --source-tag "$CI_COMMIT_TAG" --source-commit "$CI_COMMIT_SHA" --promotion-tag "$ops_tag" --image "$IMAGE_DIGEST"
    git -C ops config user.name "family-tree release bot"
    git -C ops config user.email "family-tree-release-bot@dungxbuif.com"
    existing=$(git -C ops ls-remote --tags --refs origin "$receipt_ref")
    if [ -n "$existing" ]; then
      git -C ops fetch --no-tags --depth 1 origin "$receipt_ref:$receipt_ref"
      git -C ops diff --quiet "$receipt_ref" -- "$OPS_MANIFEST"
      exit 0
    fi
    git -C ops add "$OPS_MANIFEST" "$OPS_CATALOG"
    if ! git -C ops diff --cached --quiet; then
      git -C ops commit -m "chore(release): promote family-tree ${CI_COMMIT_TAG#prod-}"
    fi
    git -C ops tag -a "$ops_tag" -m "family-tree ${CI_COMMIT_TAG} promotion receipt"
    git -C ops push --atomic origin HEAD:refs/heads/main "$receipt_ref:$receipt_ref"
